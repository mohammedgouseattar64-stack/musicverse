name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed HTTPS site, e.g. https://musicverse.onrender.com"
        required: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Set site URL
        run: |
          case "${{ inputs.app_url }}" in https://*) ;; *) echo "URL must start with https://"; exit 1;; esac
          sed -i "s#__APP_URL__#${{ inputs.app_url }}#" capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: Icon and splash
        run: npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Build APK (debug-signed, installable)
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MUSICVERSE-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
